# Expired license window -> EXPIRED_WINDOW ("renew it"), not "missing".
now: "2026-08-30T12:00:00+00:00"
assets:
  - { id: shot_v3, label: composite }
  - { id: old_bed, label: "license lapsed last year" }
edges:
  - { asset: shot_v3, ingredient: old_bed }
claims:
  - { claim_id: g3, kind: generation, asset: shot_v3, signer: veo-key, issued_at: "2026-08-01T00:00:00+00:00" }
  - claim_id: lic_expired
    kind: license
    asset: old_bed
    signer: publisher-key
    trusted: true
    issued_at: "2024-07-01T00:00:00+00:00"
    scope:
      channels: [trailer]
      territories: [US]
      valid_until: "2025-06-30T23:59:59+00:00"
actions:
  - name: publish_after_expiry
    verb: publish
    asset: shot_v3
    channel: trailer
    territory: US
    expect:
      allowed: false
      reason: EXPIRED_WINDOW
      detail_contains: "window expired"
