# THE demo beat: music licensed festival-only; trailer publish must be DENIED
# with SCOPE_EXCEEDED naming the channel.
now: "2026-08-30T12:00:00+00:00"
assets:
  - { id: shot_v2, label: "composite with festival-only bed" }
  - { id: music_bed_fest, label: "festival-only music" }
edges:
  - { asset: shot_v2, ingredient: music_bed_fest }
claims:
  - { claim_id: g2, kind: generation, asset: shot_v2, signer: veo-key, issued_at: "2026-08-01T00:00:00+00:00" }
  - claim_id: lic_fest
    kind: music_clearance
    asset: music_bed_fest
    signer: label-key
    issued_at: "2026-07-01T00:00:00+00:00"
    scope:
      channels: [festival]
      territories: [US, CA]
      valid_until: "2027-01-01T00:00:00+00:00"
actions:
  - name: publish_trailer_denied
    verb: publish
    asset: shot_v2
    channel: trailer
    territory: US
    expect:
      allowed: false
      reason: SCOPE_EXCEEDED
      detail_contains: "'trailer' outside ['festival']"
