apiVersion: serving.knative.dev/v1
kind: Service
metadata:
  name: doctus-studio
  annotations:
    run.googleapis.com/launch-stage: GA
    run.googleapis.com/ingress: all
spec:
  template:
    metadata:
      annotations:
        autoscaling.knative.dev/minScale: '0'
        autoscaling.knative.dev/maxScale: '10'
        run.googleapis.com/cpu-throttling: 'true'
        run.googleapis.com/startup-cpu-boost: 'true'
    spec:
      containerConcurrency: 80
      timeoutSeconds: 300
      containers:
        - image: us-central1-docker.pkg.dev/PROJECT_ID/doctus/doctus-studio:latest
          ports:
            - name: http1
              containerPort: 8080
          resources:
            limits:
              cpu: 1000m
              memory: 1Gi
          env:
            - name: CLICKHOUSE_HOST
              value: ""
            - name: CLICKHOUSE_USER
              value: ""
            - name: CLICKHOUSE_PASSWORD
              value: ""
            - name: CORS_ORIGINS
              value: "*"
          startupProbe:
            httpGet:
              path: /api/health
              port: 8080
            initialDelaySeconds: 5
            periodSeconds: 5
            failureThreshold: 6
          livenessProbe:
            httpGet:
              path: /api/health
              port: 8080
            periodSeconds: 15
