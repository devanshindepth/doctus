[project]
name = "doctus"
version = "0.1.0"
description = "Chain-of-title as executable policy: provenance-derived permissions that gate AI production agents."
readme = "README.md"
requires-python = ">=3.12"
license = { text = "MIT" }
dependencies = [
    "pyyaml>=6",
    "c2pa-python>=0.37",
]

[dependency-groups]
dev = [
    "pytest>=8",
    "hypothesis>=6",
    "pillow>=11",
]
# P4 cloud seams (DESIGN.md §6): optional groups - the offline core never needs them.
adk = [
    "google-adk>=1.8",
]
gcp = [
    "google-genai>=1.20",
]
dashboard = [
    "fastapi>=0.111",
    "uvicorn[standard]>=0.29",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/doctus"]

[tool.pytest.ini_options]
testpaths = ["tests"]
