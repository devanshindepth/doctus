[project]
name = "doctus"
version = "0.1.0"
description = "Chain-of-title as executable policy: provenance-derived permissions that gate AI production agents."
readme = "idea.md"
requires-python = ">=3.12"
license = { text = "MIT" }
dependencies = [
    "pyyaml>=6",
]

[dependency-groups]
dev = [
    "pytest>=8",
    "hypothesis>=6",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/doctus"]

[tool.pytest.ini_options]
testpaths = ["tests"]
